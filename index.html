<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>醫療服務組抽班系統</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { padding: 0; margin: 0; height: 100%; background: #f8fafc; font-family: system-ui, "Noto Sans TC", sans-serif; }
    iframe { display: block; width: 100%; height: 100dvh; border: 0; background: white; }
    #setup { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .panel { width: min(100%, 620px); border: 1px solid #e2e8f0; border-radius: 20px; background: white; padding: 32px; box-shadow: 0 10px 30px rgba(15,23,42,.07); }
    h1 { font-size: 24px; margin: 0 0 12px; color:#1e293b; } p { line-height:1.8; color:#475569; }
    code { background: #f1f5f9; padding: 2px 5px; border-radius: 4px; }
    a {color:#4338ca;}
  </style>
</head>
<body>
  <div id="setup" hidden>
    <div class="panel">
      <h1>醫療服務組抽班系統</h1>
      <p>尚未設定 Apps Script 網址。請在 GitHub 儲存庫的 <code>index.html</code> 中，把 <code>APPS_SCRIPT_URL</code> 的值改成部署後的 <code>/exec</code> 網址。</p>
      <p>為維持雲端抽籤與試算表寫入，請保留 Apps Script 專案中的 <code>Code.gs</code> 及 <code>Index.html</code>，並使用本套件提供的新版 <code>Code.gs</code> 允許嵌入。</p>
    </div>
  </div>
  <iframe id="app" title="醫療服務組抽班系統" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>
  <script>
    // 只需更改這一行：請填入 Google Apps Script 部署後的 /exec 網址。
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby9eRx9VIEeVR2OqTRynI_nuPuz1z2bHET4wbsAgi1JsL2Tt0mfndihzB0NpC3sC2Dj/exec';
    const valid = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/.test(APPS_SCRIPT_URL);
    document.getElementById(valid ? 'app' : 'setup').hidden = false;
    if (valid) document.getElementById('app').src = APPS_SCRIPT_URL;
  </script>
</body>
</html>
